services:
  simulator:
    image: openfsp/simulator:latest
    environment:
      SENTRY_DSN: ${SENTRY_DSN_BACKEND}
      SENTRY_ENVIRONMENT: production
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_JSON: '{"openfsp":{"simulator":{"public-base-url":"https://simulator-api.openfsp.org","operators":{"mock_openfsp":{"return-url":"https://gateway.openfsp.org/return/mock_openfsp"},"mock_moncash":{"return-url":"https://gateway.openfsp.org/return/mock_moncash"},"mock_natcash":{"return-url":"https://gateway.openfsp.org/return/mock_natcash"}}}}}'

  simulator-ui:
    image: openfsp/simulator-ui:latest
    environment:
      SENTRY_DSN: ${SENTRY_DSN_FRONTEND}
      SENTRY_ENVIRONMENT: production
    depends_on: [simulator]
