services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openfsp
      POSTGRES_USER: openfsp
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openfsp"]
      interval: 5s
      retries: 30

  validator:
    image: ghcr.io/openfspht/validator:0.5.0
    environment:
      SENTRY_DSN: ${SENTRY_DSN_BACKEND}
      SENTRY_ENVIRONMENT: production
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      OPENFSP_VALIDATOR_BEHIND_TRUSTED_PROXY: "true"
      OPENFSP_VALIDATOR_PUBLIC_URL: https://validator.openfsp.org
      OPENFSP_VALIDATOR_ATTESTATION_PUBLIC_URL: https://validator.openfsp.org
      OPENFSP_VALIDATOR_ATTESTATION_SIGNING_KEY_PRIVATE_KEY_FILE: /run/secrets/attestation-signing-key
      OPENFSP_UI_SENTRY_DSN: ${SENTRY_DSN_FRONTEND}
      OPENFSP_UI_SENTRY_ENVIRONMENT: production
    secrets:
      - attestation-signing-key
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

secrets:
  attestation-signing-key:
    environment: OPENFSP_VALIDATOR_ATTESTATION_SIGNING_KEY
