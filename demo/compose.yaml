services:
  shop:
    image: openfsp/demo:0.3.2
    environment:
      OPENFSP_BASE_URL: https://gateway.openfsp.org
      OPENFSP_API_KEY: ofsp_test_DemoShopKeyPublishedForTheSimulator01
      SHOP_WEBHOOK_URL: https://demo.openfsp.org/webhooks/openfsp
      SHOP_PUBLIC_URL: https://demo.openfsp.org
      SENTRY_DSN: ${SENTRY_DSN_DEMO}
      SENTRY_ENVIRONMENT: production
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3000/health')).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
