name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uvx --from actionlint-py==1.7.12.25 actionlint

  compose:
    runs-on: ubuntu-latest
    env:
      SERVICE_PASSWORD_POSTGRES: ci
      OPENFSP_ADMIN_TOKEN: ci
      OPENFSP_APP_KEY: ci
      OPENFSP_DEMO_API_KEY: ci
      OPENFSP_VALIDATOR_ATTESTATION_SIGNING_KEY: ci
      SENTRY_DSN_BACKEND: ""
      SENTRY_DSN_FRONTEND: ""
      SENTRY_DSN_DEMO: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          for stack in gateway simulator validator demo; do
            docker compose -f "$stack/compose.yaml" config --quiet
            docker compose -f "$stack/compose.yaml" pull --quiet
          done
