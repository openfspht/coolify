services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openfsp
      POSTGRES_USER: openfsp
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-v1:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openfsp"]
      interval: 5s
      retries: 30

  gateway:
    image: openfsp/gateway:0.6.0
    environment:
      SENTRY_DSN: ${SENTRY_DSN_BACKEND}
      SENTRY_ENVIRONMENT: production
      OPENFSP_TLS_TERMINATED_BY_PROXY: "true"
      OPENFSP_TRUSTED_PROXIES: ${OPENFSP_TRUSTED_PROXIES}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      OPENFSP_ADMIN_HOST: console.openfsp.org
      OPENFSP_UI_SENTRY_DSN: ${SENTRY_DSN_FRONTEND}
      OPENFSP_UI_SENTRY_ENVIRONMENT: production
      OPENFSP_APP_KEY: ${OPENFSP_APP_KEY}
      OPENFSP_CONFORMANCE_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: simulated,demo
      OPENFSP_PUBLIC_BASE_URL: https://gateway.openfsp.org
      OPENFSP_SIMULATOR_URL: https://simulator.openfsp.org
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-v1:
