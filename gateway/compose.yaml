services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openfsp
      POSTGRES_USER: openfsp
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openfsp"]
      interval: 5s
      retries: 30

  gateway:
    image: openfsp/gateway:latest
    environment:
      SENTRY_DSN: ${SENTRY_DSN_BACKEND}
      SENTRY_ENVIRONMENT: production
      SPRING_PROFILES_ACTIVE: development,docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfsp
      SPRING_DATASOURCE_USERNAME: openfsp
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      OPENFSP_ADMIN_TOKEN: ${OPENFSP_ADMIN_TOKEN}
      OPENFSP_APP_KEY: ${OPENFSP_APP_KEY}
      OPENFSP_BOOTSTRAP_KEY: ${OPENFSP_DEMO_API_KEY}
      OPENFSP_CONFORMANCE_ENABLED: "true"
      SPRING_APPLICATION_JSON: '{"openfsp":{"public-base-url":"https://gateway.openfsp.org","providers":{"mock_openfsp":{"base-url":"https://simulator-api.openfsp.org/mock_openfsp"},"mock_moncash":{"base-url":"https://simulator-api.openfsp.org/mock_moncash/Api","secondary-url":"https://simulator-api.openfsp.org/mock_moncash/Moncash-middleware"},"mock_natcash":{"base-url":"https://simulator-api.openfsp.org/mock_natcash/api/online-payment"}},"webhooks":{"endpoints":{"demo-shop":{"url":"https://demo.openfsp.org/webhooks/openfsp"}}}}}'
    depends_on:
      postgres:
        condition: service_healthy

  console:
    image: openfsp/console:latest
    environment:
      SENTRY_DSN: ${SENTRY_DSN_FRONTEND}
      SENTRY_ENVIRONMENT: production
    depends_on: [gateway]

volumes:
  postgres-data:
