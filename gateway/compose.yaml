services:
  gateway:
    image: openfsp/gateway:0.7.0
    environment:
      SENTRY_DSN: ${SENTRY_DSN_BACKEND}
      SENTRY_ENVIRONMENT: production
      OPENFSP_TLS_TERMINATED_BY_PROXY: "true"
      OPENFSP_TRUSTED_PROXIES: ${OPENFSP_TRUSTED_PROXIES}
      SPRING_DATASOURCE_URL: ${DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      OPENFSP_ADMIN_HOST: console.openfsp.org
      OPENFSP_UI_SENTRY_DSN: ${SENTRY_DSN_FRONTEND}
      OPENFSP_UI_SENTRY_ENVIRONMENT: production
      OPENFSP_APP_KEY: ${OPENFSP_APP_KEY}
      OPENFSP_CONFORMANCE_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: simulated,demo
      OPENFSP_PUBLIC_BASE_URL: https://gateway.openfsp.org
      OPENFSP_SIMULATOR_URL: https://simulator.openfsp.org
      OPENFSP_WEBHOOKS_ENDPOINTS_DEMOSHOP_URL: https://demo.openfsp.org/webhooks/openfsp
      OPENFSP_WEBHOOKS_ENDPOINTS_DEMOSHOP_EVENTS: payment.created,payment.succeeded,payment.failed,payment.expired,payment.canceled
